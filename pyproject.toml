[tool.poetry]
name = "rag-platform"
version = "0.1.0"
description = "Enterprise-grade Retrieval-Augmented Generation service API"
authors = ["Jah-Wilson Teeba <jahwilsont@gmail.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "rag_platform", from = "src" }]

[tool.poetry.dependencies]
python = "3.12.3"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.2"
structlog = "^24.4.0"
python-multipart = "^0.0.12"
pyjwt = "^2.9.0"
bcrypt = "^4.2.0"
email-validator = "^2.2.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
asyncpg = "^0.30.0"
uuid6 = "^2024.7.10"
redis = "^5.1.1"
celery = "^5.4.0"
flower = "^2.0.1"
minio = "^7.2.20"
pymupdf = "^1.24.0"
python-docx = "^1.1.2"
pytesseract = "^0.3.13"
flask = "^3.1.3"
openai = "^1.54.0"
qdrant-client = "1.12.1"
numpy = "^1.26.4"
torch = { version = "2.5.1", optional = true }
transformers = { version = "^5.0.0", optional = true }
sentence-transformers = { version = "^6.0.1", optional = true }

[tool.poetry.extras]
local-embeddings = ["torch", "transformers", "sentence-transformers"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"
ruff = "^0.9.0"
black = "^24.8.0"
mypy = "^1.11.2"
pre-commit = "^3.8.0"
moto = {extras = ["s3"], version = "^5.2.3"}
flask-cors = "^6.0.5"

[[tool.poetry.source]]
name = "safety"
url = "https://pkgs.safetycli.com/repository/student-d6337/project/rag-platform/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff — linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",   # allow FastAPI's Depends(...) as a default argument
    "UP046",  # PEP 695 generic syntax doesn't mix cleanly with pydantic
              # `Generic[T]` models yet — keep `class Page(BaseModel, Generic[T])`.
]

[tool.ruff.lint.isort]
known-first-party = ["rag_platform"]

[tool.ruff.lint.per-file-ignores]
# S101: `assert` is the point of a test file.
# TCH001-TCH003: test files import fixture/client types for readability at
# the call site; the TYPE_CHECKING-block ceremony pays for itself in library
# code but adds noise in test modules.
"tests/*" = ["S101", "TCH001", "TCH002", "TCH003"]
# TCH001-TCH003: FastAPI resolves route and dependency-function type hints
# at runtime (via `typing.get_type_hints`) to build the dependency graph and
# to validate/convert path, query, and body parameters. Moving those types
# into a `TYPE_CHECKING` block — invisible at runtime — breaks that
# resolution. API-layer modules (routers, dependency providers, Pydantic
# schemas) are exempt from these rules for that reason; every other layer
# (domain, application, infrastructure) still follows them.
"src/rag_platform/**/api/**/*.py" = ["TCH001", "TCH002", "TCH003"]
# Same reasoning, for FastAPI dependency-provider modules that live outside
# an api/ folder (e.g. `platform/database/dependencies.py`) — anything
# FastAPI calls as a `Depends()` needs its parameter types resolvable.
"src/rag_platform/**/dependencies.py" = ["TCH001", "TCH002", "TCH003"]
# TCH001: domain entities get wrapped in generic Pydantic models elsewhere
# (e.g. `Page[User]` in `user_service.py`) — Pydantic then has to resolve
# every field type on the entity itself at runtime, so a domain entity's own
# field types can't be TYPE_CHECKING-only even though the entity module
# itself has no other framework dependency.
"src/rag_platform/**/domain/entities.py" = ["TCH001", "TCH002", "TCH003"]
# TCH001-TCH003: SQLAlchemy 2.0's `Mapped[...]` annotations are resolved at
# class-definition time to infer each column's type — the same runtime-
# resolution requirement as Pydantic fields, for the same reason. ORM model
# modules are exempt for that reason.
"src/rag_platform/**/infrastructure/models.py" = ["TCH001", "TCH002", "TCH003"]
# Same SQLAlchemy `Mapped[...]` reasoning as above — these are the mixins
# every ORM model composes with.
"src/rag_platform/core/db.py" = ["TCH001", "TCH002", "TCH003"]
# Alembic-generated migration scripts follow Alembic's own template, not
# this project's import-layering conventions.
"alembic/**/*.py" = ["TCH001", "TCH002", "TCH003", "I001"]

# ---------------------------------------------------------------------------
# Black — formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# MyPy — static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz", "pytesseract"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rag_platform.document_management.tasks.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "rag_platform.indexing.tasks.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=rag_platform --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/rag_platform"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
