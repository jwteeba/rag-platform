# Phase 1 scope: the API service only. Postgres, Redis, MinIO, Qdrant, and
# OpenSearch are introduced in the compose file in the phases that need them
# (3, 4, 5, 9) rather than stubbed in here ahead of time.
services:
  api:
    build:
      context: .
      target: runtime
    command: >
      uvicorn rag_platform.main:app
      --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: development
      APP_LOG_FORMAT: console
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
