services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_platform
    ports:
      # Use port 5433 for host to avoids silent host-port collision.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: elestio/minio
    command: server /data --console-address ":9001"
    ports:
      # # MinIO S3 API on 9000, web console on 9001.
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    ports:
      - "16686:16686"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.0.11
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  api:
    build:
      context: .
      target: builder
    command: >
      poetry run uvicorn rag_platform.main:app
      --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: development
      APP_LOG_FORMAT: console
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_platform
      APP_REDIS_HOST: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: minioadmin
      APP_MINIO_SECRET_KEY: minioadmin
      APP_MINIO_SECURE: "false"
      APP_QDRANT_HOST: qdrant
      APP_QDRANT_PORT: "6333"
      APP_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery_worker:
    build:
      context: .
      target: builder
    command: poetry run celery -A rag_platform.worker.celery worker --loglevel=INFO
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: development
      APP_LOG_FORMAT: console
      APP_REDIS_HOST: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: minioadmin
      APP_MINIO_SECRET_KEY: minioadmin
      APP_MINIO_SECURE: "false"
      APP_QDRANT_HOST: qdrant
      APP_QDRANT_PORT: "6333"
      APP_OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  flower:
    build:
      context: .
      target: builder
    command: poetry run celery -A rag_platform.worker.celery flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      APP_REDIS_HOST: redis://redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
