services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_platform
    ports:
      # Use port 5433 for host to avoids silent host-port collision.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      # Use port 6380 for host to avoids silent host-port collision.
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # API on 9000 (remapped to 9000 on host), console on 9001.
      # Use 9001 for host-side test access to avoid collisions with any
      # locally-installed MinIO already on 9000.
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6333/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      target: builder
    command: >
      poetry run uvicorn rag_platform.main:app
      --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: development
      APP_LOG_FORMAT: console
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_platform
      APP_REDIS_URL: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: minioadmin
      APP_MINIO_SECRET_KEY: minioadmin
      APP_MINIO_SECURE: "false"
      APP_QDRANT_HOST: qdrant
      APP_QDRANT_PORT: "6333"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery_worker:
    build:
      context: .
      target: builder
    command: poetry run celery -A rag_platform.worker.celery worker --loglevel=INFO
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: development
      APP_LOG_FORMAT: console
      APP_REDIS_URL: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: minioadmin
      APP_MINIO_SECRET_KEY: minioadmin
      APP_MINIO_SECURE: "false"
      APP_QDRANT_HOST: qdrant
      APP_QDRANT_PORT: "6333"
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  flower:
    build:
      context: .
      target: builder
    command: poetry run celery -A rag_platform.worker.celery flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      APP_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
