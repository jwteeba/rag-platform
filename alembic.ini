[alembic]
script_location = alembic

# Timezone-aware, sortable revision filenames: YYYY_MM_DD_HHMM-slug.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# `sqlalchemy.url` is intentionally NOT set here — it's not safe to
# hardcode a database URL (including its credentials) in a file that gets
# committed to version control. `alembic/env.py` reads it from `Settings`
# (the same `APP_DATABASE_URL` environment variable the application itself
# uses) at runtime instead.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
