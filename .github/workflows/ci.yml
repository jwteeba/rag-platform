name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POETRY_VERSION: "1.8.3"
  PYTHON_VERSION: "3.12.3"

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: python -m pip install poetry==${{ env.POETRY_VERSION }}

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-v2-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff
        run: poetry run ruff check .

      - name: Black --check
        run: poetry run black --check .

      - name: MyPy
        run: poetry run mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        env:
          APP_REDIS_URL: redis://redis:6379/0

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 16333:6333
          - 16334:6334
        options: --entrypoint /qdrant/qdrant
          
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-v2-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # GH Actions `services:` can't override the entrypoint/command, so
      # MinIO is started manually. The container is named `minio` and
      # health-checked from the runner side before pytest runs.
      - name: Start MinIO

        run: |
          # Clean up any stale container from a previous local `act` run
          docker container prune -f 2>/dev/null || true

          # Force remove any stale container holding port 9000
          docker ps -q --filter "publish=9000" | xargs -r docker rm -f 2>/dev/null || true

          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd="curl -f http://localhost:9000/minio/health/ready || exit 1" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=3 \
            elestio/minio server /data

      - name: Create MinIO test bucket
        run: |
          docker exec -u 0 minio mkdir -p /data/rag-platform-test

      - name: Run tests with coverage
        env:
          APP_TEST_MINIO_ENDPOINT: localhost:9000
          APP_TEST_MINIO_BUCKET: rag-platform-test
        run: poetry run pytest

      - name: Upload coverage report
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml


  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rag-platform:ci .
